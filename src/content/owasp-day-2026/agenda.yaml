# OWASP Meetup+ 2026: agenda. Cada elemento es una franja horaria, en orden.
#
# Lo que se escribe acá es lo que se ve SIEMPRE (el texto genérico). El detalle de cada
# charla (título, oradores, resumen) vive en talks.yaml y solo se publica con
# sections.talks: true en event.yaml. Hasta entonces se muestra el texto de acá.
#
# Campos de cada franja:
#   time       hora de inicio, entre comillas: "09:30"
#   kind       session (charlas), break (pausa) o mate (pausa destacada, café)
#   sessions   una o dos sesiones en paralelo. Cada sesión:
#                track   sala: main (Charla), lab (Taller), keynote o panel.
#                        No hace falta en las pausas.
#                title   título genérico, ej. "Charla 1"
#                by      texto genérico de quién la da, ej. "TBD" (opcional)
#                talk    clave de la charla en talks.yaml (opcional). Con sections.talks
#                        en true, título y oradores se toman de ahí.

- time: "09:00"
  kind: break
  sessions:
    - title: Ingreso

- time: "09:45"
  sessions:
    - track: main
      title: Apertura

- time: "10:00"
  sessions:
    - track: main
      title: Charla 1
      by: TBD
      talk: "1"

- time: "10:40"
