hero:
  tagline: Una jornada abierta y gratuita sobre seguridad de aplicaciones.

about:
  title: Un día para hablar de *ciberseguridad*.
  lead: "OWASP Meetup+ Uruguay es una jornada abierta a quien desarrolla, prueba, opera o protege software: desarrolladores, QA, DevOps, equipos de seguridad, estudiantes y curiosos."
  text: "Charlas sobre ciberseguridad, con lugar para preguntas, de gente que trabaja en esto todos los días. La entrada es gratuita."
  chapterTitle: El capítulo OWASP Uruguay
  chapterText: |-
    OWASP es una fundación sin fines de lucro que impulsa la seguridad del software con proyectos abiertos como el Top 10, ASVS y SAMM.

    El capítulo de Uruguay existe desde 2010 y organiza meetups, talleres y jornadas gratuitas. La información oficial del capítulo está en [owasp.org/chapters/uruguay](https://owasp.org/chapters/uruguay).

callForSpeakers:
  title: Call for *speakers*
  text: "Buscamos charlas sobre seguridad de aplicaciones para compartir con la comunidad local. Las propuestas las revisa un comité por relevancia, precisión técnica, originalidad y claridad."
  format: "Charlas de 40 minutos con preguntas incluidas, en español o en inglés. La asistencia es gratuita; no se cubren viajes ni alojamiento."
  topics:
    - Seguridad web
    - Seguridad móvil
    - APIs
    - Cloud
    - DevSecOps y SSDLC
    - Identidad y accesos
    - Criptografía
    - Testing de seguridad
    - IA, IoT y tecnologías emergentes
    - Casos reales
    - Aspectos legales y cumplimiento
  closedText: La convocatoria cerró. Gracias a todas las personas que mandaron su propuesta.

