# OWASP Meetup+ 2026: charlas seleccionadas (call for speakers) y detalle del panel.
#
# ESTE ARCHIVO NO SE PUBLICA hasta que sections.talks sea true en event.yaml: mientras tanto
# la agenda muestra "Charla N / TBD" (ver agenda.yaml) y nada de acá llega al HTML.
# Con sections.speakers en true, además, se publica la grilla de oradores.
# Para revisar en local: npm run dev:all, o SHOW_HIDDEN=talks npm run dev.
#
# El orden de la lista es el orden de la grilla de oradores. `id` es la clave que usa agenda.yaml
# en el campo `talk` de cada sesión.
#
# Campos de cada charla:
#   id        clave, entre comillas: "1", "2"... o "panel"
#   title     título
#   language  es o en (las charlas en inglés llevan una marca en la agenda)
#   level     beginner, intermediate o advanced (informativo, hoy no se muestra)
#   abstract  resumen; una línea en blanco separa párrafos
#   speakers  una o más personas (en una charla con dos oradores, se listan los dos). Cada una:
#     name / lastName   nombre y apellido
#     role              cargo · empresa (opcional)
#     bio               biografía (opcional, hoy no se muestra)
#     linkedin          perfil de LinkedIn: de ahí sale la foto y el enlace de la tarjeta
#     photo             foto cuadrada en ./speakers/, ej. ./speakers/ana-perez.jpg (opcional; sin foto va una silueta)
#     color             yellow o blue, círculo detrás de la foto (opcional; si falta, alterna)

- id: "1"
  title: "Hands on: agentes de IA en pentest"
  language: es
  level: intermediate
  abstract: |-
    ¿Cuánto más rinde un pentester cuando trabaja con IA? Esta sesión recorre la evolución del uso de IA en el ethical hacking: desde los primeros usos como asistente para escribir exploits, con un caso real que pasó de hacerse a mano a resolverse en una fracción del tiempo, hasta los harness de agentes que se usan hoy.

    La parte central es práctica: mostramos cómo armar un harness de agentes y cómo aplicarlo, con OWASP Juice Shop como objetivo, en todas las etapas de un pentest de caja blanca, desde el reconocimiento y la identificación de la superficie hasta la detección, la explotación y el reporte. En cada etapa vemos qué hace el agente, qué hace la persona y cuánto tiempo se gana. Cerramos con los números reales de la corrida: hallazgos, cobertura, tiempo y costo, y analizamos cómo extender el enfoque a pentests de caja gris y caja negra.

    Una regla atraviesa toda la sesión: los agentes encuentran, las personas deciden.
  speakers:
      - name: "Pablo"
        lastName: "Alzuri"
        role: "CISO · QoxIT"
        bio: "Ingeniero en Computación y Especialista en Seguridad Informática egresado de la Universidad de la República (UdelaR), certificado Google Professional Cloud Security Engineer. CISO de QoxIT, empresa de desarrollo de software y ciberseguridad con operaciones en Uruguay, Perú y Estados Unidos. Más de 20 años de experiencia nacional e internacional en arquitectura de software, seguridad de la información y seguridad de aplicaciones, con foco en ciclo de desarrollo seguro y ethical hacking para instituciones de salud, organismos públicos y empresas privadas. Colaborador de OWASP Uruguay desde 2011 y Chapter Leader entre 2024 y 2026. Actualmente investiga el uso de agentes de IA en pruebas de penetración."
        linkedin: "https://www.linkedin.com/in/palzuri/"
        photo: ./speakers/pablo-alzuri.jpg

- id: "2"
  title: "Caminos del deseo: cómo hacer que las personas quieran ser seguras"
  language: es
  level: beginner
  abstract: |-
    En los parques, la gente suele ignorar los senderos diseñados por los arquitectos y crean sus propios caminos sobre el pasto. Con el tiempo, esos recorridos se vuelven visibles. Se los conoce como Desire Paths, o caminos del deseo, y revelan una verdad incómoda: las personas no siempre hacen lo que esperamos, sino lo que les resulta más natural, sencillo o conveniente.

    En ciberseguridad nos pasa lo mismo.

    Diseñamos políticas, procedimientos, herramientas y controles esperando que las personas los sigan. Pero los desarrolladores encuentran formas de evitar verificaciones, los usuarios buscan alternativas a las restricciones y los equipos de seguridad terminan creando sus propios atajos.

    ¿Y si en lugar de intentar impedir esto lo comprendemos?

    Esta charla propone mirar la seguridad desde una perspectiva diferente: observar los caminos que las personas realmente recorren para descubrir cómo diseñar controles que quieran utilizar.

    A través de ejemplos cotidianos, situaciones del desarrollo seguro de software y una metodología sencilla, exploraremos cómo transformar la fricción en oportunidades de mejora.

    Porque quizás el futuro de la ciberseguridad no consista en construir cercas más altas, sino en diseñar mejores caminos.
  speakers:
      - name: "Santiago"
        lastName: "Ingold"
        role: "Fundador · BlackPitbull y ExpertoCiber"
        bio: "Especialista en ciberseguridad con más de 10 años de experiencia asegurando entornos críticos. Fundador de BlackPitbull, consultora especializada en ciberseguridad, y de ExpertoCiber, iniciativa dedicada a la divulgación y formación.Apasionado por cuestionar enfoques tradicionales y explorar nuevas perspectivas sobre la seguridad, la tecnología y el comportamiento humano."
        linkedin: "https://www.linkedin.com/in/experto-ciber/"
        photo: ./speakers/santiago-ingold.jpg

- id: "3"
  # Co-speaker según la planilla: Antônio Bittencourt (sin LinkedIn ni empresa en la planilla).
  title: "When AI Agents Meet Payment APIs: The New Authorization Problem"
  language: en
  level: advanced
  abstract: |-
    AI agents are evolving beyond conversational assistants into autonomous systems capable of executing business workflows and initiating financial transactions. This raises a critical security question: Does an authenticated AI agent have the authority to move money?

    This session explores the security challenges of agent-driven payments through a realistic scenario inspired by Brazil’s fintech ecosystem. An AI agent is instructed to distribute R$100,000 to 200 eligible recipients. What happens when an attacker manipulates campaign data to introduce an unauthorized beneficiary?

    Through threat modeling, reference architectures, and a controlled technical demonstration, we examine how agentic threats intersect with traditional API vulnerabilities.

    We connect these risks to the OWASP Top 10 for Agentic Applications (2025) and the OWASP API Security Top 10, focusing on Agent Goal Hijack, Tool Misuse, privilege abuse, and broken authorization.

    Attendees will explore practical security controls, including independent authorization policies, explicit delegation, tenant isolation, transaction limits, human approval, and auditability.

    Combining fintech experience with hands-on security engineering, this session demonstrates how to prevent unauthorized financial transactions, even when AI agents are compromised.

    Target audience: Security professionals, API developers, architects, fintech engineers, and technology leaders.

    Key takeaway: AI agents can propose financial actions, but only independent authorization controls should decide whether money moves.
  speakers:
      - name: "André"
        lastName: "Agostinho"
        role: "CPTO · OnlyPay"
        bio: "André Agostinho is Chief Product and Technology Officer (CPTO) at OnlyPay, a Brazilian fintech specializing in incentive payments. With over 25 years of experience in technology leadership, he has driven software engineering, cloud architecture, and digital transformation initiatives, contributing to two successful technology exits involving QuintoAndar and Eletromidia. He holds a BSc in Computer Science, pursued MSc studies in Computer Engineering, and completed the CTO Program at UC Berkeley Haas School of Business. His current focus includes secure payment platforms, API security, cybersecurity, and the responsible adoption of AI agents in financial services."
        linkedin: "https://www.linkedin.com/in/andre-agostinho"
        photo: ./speakers/andre-agostinho.jpg
      - name: "Antônio"
        lastName: "Bittencourt"
        role: "TL Cloud & Platform"
