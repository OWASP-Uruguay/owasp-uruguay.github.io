- id: "4"
  title: "ADversary: From User to Domain Admin"
  language: es
  level: beginner
  abstract: |-
    ADversary: From User to Domain Admin es una charla práctica sobre cómo se puede comprometer un entorno de Active Directory desde una perspectiva ofensiva, empezando únicamente con una cuenta de dominio con pocos privilegios y avanzando hasta alcanzar el control del dominio.
    Durante la charla veremos técnicas que aparecen de forma habitual en evaluaciones reales de Active Directory y también en entrenamientos avanzados. Hablaremos de enumeración, abuso de credenciales, ataques Kerberos, configuraciones inseguras, escalada de privilegios, movimiento lateral, análisis de rutas de ataque y otras técnicas que pueden terminar llevando a privilegios de Domain Admin.
    La idea no es simplemente mostrar una colección de comandos o herramientas, sino entender cómo distintas debilidades dentro del entorno pueden conectarse entre sí y convertirse en una ruta de ataque completa. Queremos mostrar el razonamiento detrás de cada paso: qué información buscar, cómo interpretarla y cómo decidir cuál puede ser el siguiente movimiento.
    También dedicaremos una parte de la charla al uso de Inteligencia Artificial aplicada al pentesting de Active Directory. Veremos ejemplos prácticos de cómo la IA puede ayudar a analizar la información obtenida durante la enumeración, interpretar relaciones y configuraciones, sugerir posibles rutas de ataque, generar o adaptar comandos y servir como apoyo durante distintas etapas de una evaluación.
    Al mismo tiempo, hablaremos de sus limitaciones y de por qué utilizar IA no sustituye el conocimiento técnico necesario para entender y validar lo que realmente está ocurriendo en el entorno.
    La charla está orientada a pentesters, red teamers, blue teamers, profesionales de seguridad, estudiantes y personas que ya tengan una base de Windows y Active Directory y quieran profundizar en seguridad ofensiva, rutas de ataque y nuevas formas de incorporar IA a este tipo de evaluaciones.
  speakers:
      - name: "Wander"
        lastName: "Astorga"
        role: "Ingeniero de Telecomunicaciones · DevSecOps"
        bio: "Ingeniero de Telecomunicaciones, CPTS, DevSecOps"
