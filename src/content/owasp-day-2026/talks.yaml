- id: "5"
  # Sitio de Nexa según la planilla: https://wearenexa.com
  title: "Una noche con ARTEX"
  language: es
  level: intermediate
  abstract: |-
    Este año nos tocó investigar una intrusión de una fintech llevada adelante con ARTEX, un framework de pentest agéntico. El atacante entró por un SSRF en una aplicación expuesta a internet, aunque no fue el SSRF lo que lo llevó lejos. Estuvo casi tres semanas juntando credenciales e intentando escalar sin suerte, hasta que encontró la llave donde nadie la estaba buscando. A partir de ahí todo se aceleró. Pasó de administrador de AWS a los clústeres de PCI en media hora, y en una sola noche recorrió lo que a un red team le lleva semanas, sin preocuparse demasiado por pasar desapercibido.

    En esta charla reconstruimos esa noche: cómo se movió entre la nube, la identidad y Kubernetes, qué fue dejando a su paso, y por qué aun haciendo ruido, llegó tan lejos. Vamos a mostrar qué rastro deja un agente y en qué se diferencia de un operador humano. Ninguna de las fallas que aprovechó era nueva; lo que cambió es la velocidad con la que un agente las encuentra y las encadena, y eso nos obliga a repensar cómo defendemos.
  speakers:
      - name: "Andrés"
        lastName: "Gómez"
        role: "Líder de práctica · Nexa"
        bio: "Líder de práctica en Nexa."
        linkedin: "https://www.linkedin.com/in/andresgo/"
        photo: ./speakers/andres-gomez.jpg

