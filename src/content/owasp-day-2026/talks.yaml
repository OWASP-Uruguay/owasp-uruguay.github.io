- id: "6"
  title: "Confiás en tu IA. El atacante cuenta con eso"
  language: es
  level: intermediate
  abstract: |-
    Cómo manipular sus respuestas y acciones sin tocar el modelo.
    Un modelo puede funcionar exactamente como fue diseñado y, aun así, responder o actuar sobre una realidad manipulada. Esta charla analiza cómo se comprometen sus datos, fuentes, contexto y herramientas sin necesidad de modificar el modelo.
