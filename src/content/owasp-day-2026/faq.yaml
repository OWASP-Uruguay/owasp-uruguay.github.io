# OWASP Meetup+ 2026: preguntas frecuentes, en orden.
# Revisar cada respuesta antes de poner sections.faq en true: algunas son de ejemplo.
#
# Campos de cada pregunta:
#   q   pregunta
#   a   respuesta. Admite [texto](url) para enlaces y **texto** para negrita.
#       Una línea en blanco separa párrafos.

- q: ¿La entrada es gratuita?
  a: Sí. Es un evento comunitario y sin costo, con registro previo en Eventbrite.

- q: ¿Cuándo y dónde es?
  a: El lunes 30 de noviembre de 2026 en el Auditorio Mario Benedetti de la Torre de las Telecomunicaciones de ANTEL, Guatemala 1075, Montevideo.

- q: ¿Necesito saber de seguridad para ir?
  a: "No. Hay contenido para todos los niveles."

- q: ¿Las charlas son en español?
  a: La mayoría sí. Si hay charlas en inglés lo indicaremos en la agenda.

- q: ¿Se va a transmitir o grabar?
  a: Estamos trabajando para grabar las charlas y publicarlas luego del evento.

- q: ¿Incluye almuerzo?
  a: No, el almuerzo es libre a cargo cada asistente en el tiempo dedicado en la agenda. Sí habrán coffe breaks incluidos.
