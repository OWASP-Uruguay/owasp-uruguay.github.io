# OWASP Day 2026: patrocinadores. Se agrupan por nivel; dentro de cada nivel, en el orden de la lista.
#
# Campos de cada sponsor:
#   tier   nivel: platino, oro, plata o comunidad
#   name   nombre de la marca (texto alternativo del logo)
#   logo   archivo del logo, ej. ./sponsors/marca.svg (opcional).
#          Sin logo se muestra un recuadro punteado con el nombre (sirve de lugar reservado).
#   url    sitio web de la marca (opcional)
# Un nivel sin sponsors no se muestra.

